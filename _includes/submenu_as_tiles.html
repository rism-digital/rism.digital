{% assign menus = site.data.[include.submenubar] %}

{% for menu in menus %}
<div class="fixed-grid rism-ch-menu-grid">
    <div class="grid">
        {% for item in menu.items %}
        <div class="cell">
            <div class="card">
            <a href="{{ item.link }}">
                <div class="card-image is-menu">
                    <img src="/images/tiles/{{ item.image }}">
                </div>
                <div class="card-content is-menu">
                    <h3>{{ item.name[site.active_lang] }}</h3>
                </div>
            </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endfor %}
