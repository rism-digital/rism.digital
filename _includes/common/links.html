<h1>{{ page.titles[site.active_lang] }}</h1>

{% for page_links in page.links %}
    {% if page_links.label.size > 0 %}
    <h3>{{ page_links.label[site.active_lang] }}</h3>
    {% endif %}

    <table class="links">
        {% for item in page_links.links %}
        <tr>
            <td>
                {% if item[0].size > 0 %}
                <a href="{{ item[1] }}" target="_blank">{{ item[0] }}</a>
                {% else %}
                &nbsp;
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
{% endfor %}
