{% assign tile = include.tile %}

<div class="card">
    <a href="{{ tile.link }}" {% if tile.blank %}target="_blank"{% endif %}>
        {% if tile.image %}
        <div class="card-image">
            <img src="/images/tiles/{{ tile.image }}">
        </div>
        {% endif %}
        <div class="card-content">
            <h1>{{ tile.titles[site.active_lang] }}</h1>
            <p>
                {{ tile.texts[site.active_lang] }}
            </p>
            {% if tile.blank %}
            <p>
                <i class="fa fa-external-link-alt"></i>
            </p>
            {% endif %}
        </div>
    </a>
</div>
