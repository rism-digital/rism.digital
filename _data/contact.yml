      person:
        - id: CB
          name: "Dr. Claudio Bacciagaluppi"
          phone: "+41(0)58 465 03 59"
          email: "claudio.bacciagaluppi@rism.digital"
          photo: "claudio.bacciagaluppi.jpg"
          text:
              en: "Claudio Bacciagaluppi studied musicology in Zurich and received his doctorate in Fribourg (Switzerland). As a post-doc researcher in Fribourg he wrote \"Artistic Disobedience: Music and Confession in Switzerland, 1648-1762\" (Leiden 2017). He is researcher at the Hochschule der Künste Bern (2006-2009 and since 2015). He has been working for RISM Switzerland since 2011. He is responsible for digitization and other special projects and takes care of translations."
              de: "Claudio Bacciagaluppi studierte Musikwissenschaft in Zürich und promovierte in Freiburg i.Ue. Als Post-Doc in Freiburg verfasste er \"Artistic Disobedience: Music and Confession in Switzerland, 1648-1762\" (Leiden 2017). Er war an verschiedenen SNF-Projekten an der Universität Freiburg beteiligt (2009-2013) und ist als Forscher an der Hochschule der Künste Bern tätig (2006-2009 und seit 2015). Für die Arbeitsstelle Schweiz des RISM arbeitet Claudio Bacciagaluppi seit 2011, wo er Digitalisierungs- sowie weitere Sonderprojekte betreut und ausserdem für Übersetzungen zuständig ist."
              fr: "Claudio Bacciagaluppi a étudié la musicologie à l'Université de Zurich et a obtenu son doctorat à Fribourg. En tant que post-doc à Fribourg il a écrit \"Artistic Disobedience: Music and Confession in Switzerland, 1648-1762\" (Leiden 2017). Il est chercheur à la Hochschule der Künste Bern (2006-2009 et depuis 2015). Il travaille depuis 2011 pour le RISM Suisse. Il est responsable de la numérisation et d'autres projets spéciaux et s'occupe des traductions."
              it: "Claudio Bacciagaluppi ha studiato musicologia a Zurigo e ha conseguito il dottorato a Friburgo (Svizzera). Come post-doc a Friburgo ha scritto \"Artistic Disobedience: Music and Confession in Switzerland, 1648-1762\" (Leiden 2017). Svolge attività di ricerca presso la Hochschule der Künste di Berna (2006-2009 e dal 2015). Lavora per RISM Svizzera dal 2011. È responsabile della digitalizzazione e di altri progetti speciali e si occupa delle traduzioni."
        - id: AH
          name: "Dr. Andrew Hankinson"
          phone: "+41(0)58 465 03 59"
          email: "andrew.hankinson@rism.digital"
          no-photo: true
          text:
              en: "Andrew Hankinson holds a Bachelor's degree in Music History and Theory (Acadia University), a Masters in Library and Information Studies (McGill University), and a PhD in Music Information Retrieval (McGill University). He was a postdoctoral researcher at the University of Oxford working on the Digital Image Archive of Medieval Music (DIAMM) project (2015-2016), and was Senior Software Engineer for Digital Collections Discovery at the Bodleian Libraries (2017–2020). Andrew has held positions on the technical group and board of the Music Encoding Initiative and with the Executive of the IIIF Consortium. Andrew specializes in web technologies for building scalable and usable search and retrieval systems, and currently leads development on the Muscat+ application."
              de: "Andrew Hankinson is a digital humanist, librarian, academic, and coder. He completed a dissertation on large-scale optical music recognition. His research focuses primarily on large-scale music document digitization, recognition, search, and retrieval. He was senior software engineer at the Bodleian Libraries in the University of Oxford, where he led the developments of the Digital Bodleian. He previously developed the DIAMM web application. He was Chair of the MEI Board, and has longstanding experience with IIIF and is a member of the IIIF A/V working group. He currently leads the development of Muscat+."
              fr: "Andrew Hankinson est titulaire d'un Bachelor en histoire et théorie de la musique (Université Acadia), d'une maîtrise en bibliothéconomie et sciences de l'information (Université McGill) et d'un doctorat en Music Information Retrieval (Université McGill). Il a été chercheur postdoctoral à l'Université d'Oxford, travaillant sur le projet Digital Image Archive of Medieval Music (DIAMM) (2015-2016), et a été ingénieur logiciel principal pour le développement de la Digital Collections Discovery de la bibliothèque Bodleian (2017-2020). Andrew a occupé des postes au sein du groupe technique et du comité directeur de la Music Encoding Initiative, ainsi qu'au sein de l'exécutif du consortium IIIF. Andrew est spécialisé dans les technologies web pour le développement de systèmes de recherche évolutifs et conviviaux, et dirige actuellement le développement de l'application Muscat+."
              it: "Andrew Hankinson is a digital humanist, librarian, academic, and coder. He completed a dissertation on large-scale optical music recognition. His research focuses primarily on large-scale music document digitization, recognition, search, and retrieval. He was senior software engineer at the Bodleian Libraries in the University of Oxford, where he led the developments of the Digital Bodleian. He previously developed the DIAMM web application. He was Chair of the MEI Board, and has longstanding experience with IIIF and is a member of the IIIF A/V working group. He currently leads the development of Muscat+."
  
        - id: YP
          name: "Yvonne Peters, M. A."
          phone: "+41(0)58 465 73 25"
          email: "yvonne.peters@rism.digital"
          photo: "yvonne.peters.jpg"
          text:
              en: "Yvonne Peters studied musicology and art history at the Jagiellonian University. After posts at the Polish music publisher PWM in Cracow (1983-1985) and at the Art History Institute of the Polish Academy of Sciences IS PAN in Warsaw (1985-1988), she worked for the RISM Central Redaction in Frankfurt (1990-2008). In June 2008 she moved to the Swiss RISM and has since been responsible for cataloguing the music collections of the Swiss National Library in Bern. In 2011-2013 she completed a CAS postgraduate course in Library and Information Science at the University of Zurich."
              de: "Yvonne Peters studierte Musikwissenschaft sowie Kunstgeschichte an der Jagiellonen-Universität Krakau. Nach einer Anstellung im Polnischen Musikverlag PWM in Krakau (1983-1985) und im Kunstgeschichtlichen Institut der Polnischen Akademie der Wissenschaften IS PAN in Warschau (1985-1988) war sie für die RISM-Zentralredaktion in Frankfurt am Main tätig (1990-2008). Im Juni 2008 wechselte sie in die Arbeitsstelle Schweiz des RISM und ist seither für die Erfassung der Musiknachlässe aus der Schweizerischen Nationalbibliothek in Bern verantwortlich. 2011/2013 absolvierte sie einen CAS-Weiterbildungsstudiengang in Bibliotheks- und Informationswissenschaften der Universität Zürich."
              fr: "Yvonne Peters a étudié la musicologie et l'histoire de l'art à l'Université Jagellonne en Pologne. Après un emploi à la maison d'édition musicale polonaise PWM à Cracovie (1983-1985) et à l'Institut d'histoire de l'art de l'Académie polonaise des sciences IS PAN à Varsovie (1985-1988), elle a travaillé pour la Rédaction centrale du RISM à Francfort (1990-2008). Elle est collaboratrice du RISM Suisse depuis juin 2008 où elle est responsable du catalogages des collections de musique de la Bibliothèque nationale suisse à Berne. De 2011 à 2013 elle a complété une formation de troisième cycle CAS en bibliothéconomie et sciences de l'information à l'Université de Zurich."
              it: "Yvonne Peters ha studiato musicologia e storia dell'arte presso l'Università Jagellonica. Dopo un impiego presso l'editore musicale polacco PWM a Cracovia (1983-1985) e presso l'Istituto di Storia dell'Arte dell'Accademia polacca delle scienze IS PAN di Varsavia (1985-1988), ha lavorato per la Redazione centrale di RISM a Francoforte (1990-2008). Nel giugno 2008 ha iniziato il lavoro presso RISM Svizzera e da allora è stata responsabile per la catalogazione delle collezioni musicali dalla Biblioteca nazionale svizzera di Berna. Nel 2011-2013 ha completato un corso post-laurea CAS in biblioteconomia e scienza dell'informazione presso l'Università di Zurigo."
        - id: RZ
          name: "Rodolfo Zitellini, M. A."
          phone: "+41(0)58 465 03 59"
          email: "rodolfo.zitellini@rism.digital"
          photo: "rodolfo.zitellini.jpg"
          text:
              en: "Rodolfo Zitellini is a musician and musicologist with a specialization in computer sciences. He obtained a Diploma in Harpsichord in Bologna (Italy) and subsequently a Master’s degree in Musicology in Fribourg. He worked as consultant for embedded software systems (2005-2011) and as a freelance musicologist. He initially participated in the SNF project <q>Printed Sacred Music in Europe 1500-1800</q> (2011-2013) as technical consultant, and since 2011 he collaborates with RISM Switzerland on the digital infrastructure and development of the cataloguing application Muscat. He is also in charge of special non-technical projects."
              de: "Rodolfo Zitellini ist Musiker und Musikwissenschaftler mit Schwerpunkt auf Informatik. Er erhielt ein Diplom als Cembalist in Bologna (Italien) und anschliessend einen Master-Abschluss in Musikwissenschaft in Freiburg i.Ue. Er arbeitete sowohl als Berater für eingebettete Software-Systeme (2005-2011) als auch als unabhängiger Musikwissenschaftler. Rodolfo Zitellini nahm am SNF-Projekt <q>Printed Sacred Music in Europe 1500-1800</q> als technischer Berater teil (2011-2013). Seit 2011 arbeitet er bei RISM Schweiz im Bereich der digitalen Infrastruktur und beschäftigt sich vornehmlich mit der Entwicklung der Katalogisierungs-Anwendung Muscat. Er ist auch zuständig für nicht-technische Sonderprojekte."
              fr: "Rodolfo Zitellini est un musicien et musicologue avec une spécialisation en informatique. Il a obtenu un diplôme en clavecin à Bologne (Italie), puis une maîtrise en musicologie à l'Université de Fribourg. Il a travaillé comme consultant pour des systèmes de logiciels embarqués (2005-2011) et comme musicologue indépendant. Il a participé au projet FNS <q>Printed Sacred Music in Europe 1500-1800</q> (2011-2013) en tant que consultant technique. Depuis 2011, il travaille au RISM Suisse dans la gestion de l'infrastructure informatique et au développement de l'application de catalogage Muscat. Il est aussi en charge de projets spéciaux non techniques."
              it: "Rodolfo Zitellini è musicista e musicologo con una specializzazione in scienze informatiche. Ha conseguito il Diploma di Clavicembalo a Bologna e successivamente un Master in Musicologia a Friburgo (Svizzera). Ha lavorato come consulente per sistemi embedded di software (2005-2011) e come musicologo indipendente. Ha partecipato al progetto FNS <q>Printed Sacred Music in Europe 1500-1800</q> (2011-2013) come consulente tecnico. Dal 2011 lavora presso RISM Svizzera all'infrastruttura digitale e allo sviluppo del software di catalogazione Muscat. Inoltre è responsabile di progetti speciali non tecnici."
         - id: LB
          name: "Lynn Beutler, M. A."
          phone: "+41(0)58 465 73 25"
          email: "lynn.beutler@rism.digital"
          no-photo: true
          text:
              en: "Lynn Beutler studied Musicology and English at the University of Bern. During her studies she already gained some work experience at the RISM Digital Center first as a student assistant and later as an intern. After completing her master’s degree in autumn 2021, she has become a permanent employee. Her main tasks are cataloging historical musical sources at different locations. What she appreciates most about her work is its versatility and the opportunity to contribute to accessing historical music sources."
              de: "Lynn Beutler studierte Musikwissenschaft im Hauptfach und Englisch im Nebenfach an der Universität in Bern. Bereits während ihres Studiums lernte sie als studentische Hilfskraft und später als Praktikantin die Arbeit beim RISM Digital Center kennen. Seit Herbst 2021, nach Abschluss ihres Masterstudiums, gehört sie als feste Mitarbeiterin zu RISM. Zu ihren Hauptaufgaben gehört das Katalogisieren und Inventarisieren von Musikquellen an diversen Standorten. An ihrer Arbeit schätzt sie besonders die Vielseitigkeit und die Möglichkeit, einen Beitrag zum Zugang zu historischen Musikquellen zu ermöglichen."
              fr: "Lynn Beutler a étudié la musicologie en branche principale et l’anglais en branche secondaire à l’Université de Berne. Pendant ses études déjà, elle a fait des expériences de travail au RISM Digital Center en tant qu’assistante étudiante puis en tant que stagiaire. Depuis l’automne 2021, à la fin de ses études de master, elle fait partie du RISM en tant que collaboratrice fixe. Ses tâches principales consistent à cataloguer et à inventorier des sources musicales sur différents sites. Elle apprécie particulièrement la diversité de son travail et la possibilité de contribuer à l'accès aux sources musicales historiques."
              it: "Lynn Beutler ha studiato musicologia e inglese all’Università di Berna. Già durante i suoi studi, ha avuto modo di fare esperienze lavorative presso il RISM Digital Center, prima come assistente studentesca e poi come stagista. Dopo aver completato il suo Master nell’autunno 2021, ha assunto un impiego stabile al RISM. I suoi compiti principali includono la catalogazione e l’inventario delle fonti musicali in vari luoghi. Ciò che apprezza particolarmente del suo lavoro è la versatilità e l’opportunità di contribuire all’accesso alle fonti musicali storiche."
