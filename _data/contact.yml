    - labels:
        en: "Co-directors"
        de: "Co-Leitung"
        fr: "Co-directeurs"
        it: "Co-direzione"
      person:
        - id: GG
          name: "Dr. Cédric Güggi"
          email: "cedric.gueggi@rism.digital"
          photo: "cedric.gueggi.jpg"
          text:
              en: "Cédric Güggi studied musicology, German linguistics and old German literature at the University of Zurich. After a first job as a researcher at the Swiss RISM Office (2006-2008) and a post at the music department of the Zurich Central Library (2008-2009), he became Co-director of RISM Switzerland in September 2009 (the RISM Digital Center as of 2021). He has since been responsible for administrative matters and inventory projects. In 2019 Cédric Güggi received his doctorate from the University of Zurich with a thesis on musical interpretation research using the example of the composer and conductor Paul Klecki (1900-1973)."
              de: "Cédric Güggi studierte Musikwissenschaften sowie deutsche Sprachwissenschaften und ältere deutsche Literatur an der Universität Zürich. Nach einer ersten Anstellung als wissenschaftlicher Mitarbeiter bei der Arbeitsstelle Schweiz des RISM (2006-2008) und einem Engagement in der Musikabteilung der Zentralbibliothek Zürich (2008-2009) übernahm er im September 2009 die Co-Leitung von RISM Schweiz (ab 2021 RISM Digital Center). Dort ist er seither verantwortlich für administrative Belange sowie die Inventarisierungsprojekte. 2019 promovierte Cédric Güggi an der Universität Zürich mit einer Arbeit zur musikalischen Interpretationsforschung am Beispiel des Komponisten und Dirigenten Paul Klecki (1900-1973)." 
              fr: "Cédric Güggi a étudié la musicologie, la linguistique allemande et la littérature allemande ancienne à l'Université de Zurich. Après un premier engagement comme collaborateur scientifique au Bureau suisse du RISM (2006-2008) et un engagement au département de musique de la Bibliothèque centrale de Zurich (2008-2009), il a repris la co-direction du RISM Suisse en septembre 2009 (le RISM Digital Center depuis 2021). Depuis, il est chargé des questions administratives et des projets d'inventaire. En 2019, Cédric Güggi a obtenu son doctorat à l'Université de Zurich avec une thèse sur la recherche en matière d'interprétation musicale en prenant l'exemple du compositeur et chef d'orchestre Paul Klecki (1900-1973)."
              it: "Cédric Güggi ha studiato musicologia e linguistica tedesca e letteratura tedesca antica presso l'Università di Zurigo. Dopo un primo impiego come ricercatore presso l'Ufficio svizzero del RISM (2006-2008) e una collaborazione con il dipartimento di musica della Biblioteca Centrale di Zurigo (2008-2009), ha assunto la co-direzione di RISM Svizzera nel settembre 2009 (RISM Digital Center dal 2021). Da allora è responsabile per le questioni amministrative e per i progetti di inventariazione. Nel 2019 Cédric Güggi ha conseguito il dottorato all'Università di Zurigo con una tesi di ricerca sull'interpretazione musicale sull'esempio del compositore e direttore d'orchestra Paul Klecki (1900-1973)."
        - id: LP
          name: "PD Dr. Laurent Pugin"
          email: "laurent.pugin@rism.digital"
          photo: "laurent.pugin.jpg"
          text:
              en: "Laurent Pugin trained both as a musicologist and a computer scientist. His work involves the field of human sciences (philology, history of musical notation, music bibliography), as well as technology applied to music sources (image processing, machine learning). Laurent Pugin was a postdoctoral researcher and lecturer at McGill University in Montreal from 2006-2009 and a visiting scholar at Stanford University, USA. He has been co-Director of the Swiss RISM since 2009, responsible for infrastructure development and international contacts. In 2013 he was appointed Board member of the International Steering Committee of the RISM. He is also co-applicant of SIMSSA, a research project based at McGill University. He has been a member of the Board of the Music Encoding Initiative (MEI) and co-chair of its technical team since 2014.<br/><br/><a href='/resources/Publist_Pugin.pdf' target='_blank'>Publications</a>"
              de: "Laurent Pugin genoss eine doppelte Ausbildung sowohl in Musikwissenschaft als auch in Informatik. Seine Forschungsbereiche betreffen damit einerseits die Geisteswissenschaften (Philologie, Geschichte der Notenschrift, Musikbibliographie) und andererseits die Anwendung von Technologien auf Musikquellen (Bildverarbeitung, maschinelles Lernen). Er war Postdoktorand und Dozent an der McGill University in Montreal und Gastforscher an der Stanford University in den USA. Seit 2009 ist er Co-Leiter der Arbeitsstelle Schweiz des RISM, wo er für die Entwicklung der digitalen Infrastruktur sowie die internationalen Kontakte zuständig ist. Ausserdem ist Laurent Pugin seit 2013 Mitglied des internationalen RISM-Vorstands. Des Weiteren engagiert er sich im SIMSSA-Projekt an der McGill University Montreal. Seit 2014 ist er zudem Mitglied des Vorstands der Music Encoding Initiative (MEI) und Co-Vorsitzender von dessen technischem Team.<br/><br/><a href='/resources/Publist_Pugin.pdf' target='_blank'>Publikationen</a>"
              fr: "Laurent Pugin a une double formation de musicologue et d'informaticien obtenue à l'Université de Genève. Son travail concerne les sciences humaines (philologie, histoire de la notation musicale, bibliographie musicale), autant que la technologie appliquée aux sources musicales (traitement d'image, apprentissage artificiel). Laurent Pugin a été chercheur postdoctoral et chargé de cours à l'Université McGill à Montréal et chercheur invité à l'Université de Stanford aux Etats-Unis. Depuis 2009, il est co-directeur du Bureau suisse du RISM où il est responsable du développement de l'infrastructure digitale et des contacts internationaux. Il est membre du Comité directeur international du RISM depuis 2013. Il est co-requérant du projet SIMSSA basé à l'Université McGill. Depuis 2014 il est membre du Comité directeur de la Music Encoding Initiative (MEI) et co-président de son équipe technique.<br/><br/><a href='/resources/Publist_Pugin.pdf' target='_blank'>Publications</a>"
              it: "Laurent Pugin ha una duplice formazione come musicologo e informatico. Le sue aree di studio riguardano tanto campi delle scienze umane (filologia, storia della notazione musicale, bibliografia musicale), quanto ambiti della tecnologia applicata alle fonti musicali (elaborazione delle immagini, apprendimento automatico). Laurent Pugin è stato ricercatore postdottorato e docente presso la McGill University di Montreal e ricercatore ospite presso la Stanford University, USA. Dal 2009 è co-direttore dell'Ufficio svizzero del RISM dove è responsabile dello sviluppo delle infrastrutture digitali e dei contatti internazionali. È membro del comitato direttivo internazionale del RISM dal 2013. È inoltre co-richiedente nel progetto SIMSSA, un progetto di ricerca con sede presso la McGill University. Dal 2014 è membro del comitato direttivo della Music Encoding Initiative (MEI) e co-presidente del suo team tecnico.<br/><br/><a href='/resources/Publist_Pugin.pdf' target='_blank'>Pubblicazioni</a>"
    - labels:
        en: "Scientific Collaborators"
        de: "Wissenschaftliche Mitarbeiter"
        fr: "Collaborateurs scientifiques"
        it: "Collaboratori scientifici"
      person:
        - id: CB
          name: "Dr. Claudio Bacciagaluppi"
          email: "claudio.bacciagaluppi@rism.digital"
          photo: "claudio.bacciagaluppi.jpg"
          text:
              en: "Claudio Bacciagaluppi was born near Milan in 1971. He studied musicology at the University of Zurich and received his doctorate in Fribourg in 2008. He was project collaborator of the Fonoteca Nazionale Svizzera (Lugano) in 2001-2002 and worked in the music library and in the research department of the Bern Academy of the Arts (HKB) from 2002-2009 and from 2015-2025. He has been working for the RISM Digital Center since 2011, where besides cataloguing he works on the thematic catalogues project and other special projects."
              de: "Claudio Bacciagaluppi wurde 1971 in der Nähe von Mailand geboren. Er studierte Musikwissenschaft an der Universität Zürich und promovierte 2008 in Freiburg i.Ue.. 2001-02 war er Projektmitarbeiter der Fonoteca Nazionale Svizzera (Lugano) und arbeitete 2002-09 sowie 2015-25 in der Musikbibliothek und in der Forschung der Hochschule der Künste Bern (HKB). Seit 2011 ist er für das RISM Digital Center tätig, wo er neben der Katalogisierungstätigkeit an der Redaktion der Werkverzeichnisse und weiterer Sonderprojekte arbeitet."
              fr: "Claudio Bacciagaluppi est né près de Milan en 1971. Il a étudié la musicologie à l'université de Zurich et a obtenu son doctorat à Fribourg en 2008. Il a été collaborateur de projet à la Fonoteca Nazionale Svizzera (Lugano) en 2001-2002 et a travaillé à la bibliothèque musicale et au département de recherche de l'Académie des arts de Berne (HKB) de 2002 à 2009 et de 2015 à 2025. Il travaille pour le RISM Digital Center depuis 2011, où, outre le catalogage, il participe au projet de catalogues thématiques et à d’autres projets spéciaux."
              it: "Claudio Bacciagaluppi è nato vicino a Milano nel 1971. Ha studiato musicologia all’Università di Zurigo e ha conseguito il dottorato a Friburgo nel 2008. È stato collaboratore di progetto della Fonoteca Nazionale Svizzera (Lugano) nel 2001-2002 e ha lavorato nella biblioteca musicale e nel dipartimento di ricerca dell’Accademia delle Arti di Berna (HKB) dal 2002 al 2009 e dal 2015 al 2025. Dal 2011 lavora per il RISM Digital Center, dove oltre alla catalogazione si occupa del progetto dei cataloghi tematici e di altri progetti speciali."
        - id: AH
          name: "Dr. Andrew Hankinson"
          email: "andrew.hankinson@rism.digital"
          no-photo: true
          text:
              en: "Andrew Hankinson holds a Bachelor's degree in Music History and Theory (Acadia University), a Masters in Library and Information Studies (McGill University), and a PhD in Music Information Retrieval (McGill University). He was a postdoctoral researcher at the University of Oxford working on the Digital Image Archive of Medieval Music (DIAMM) project (2015-2016), and was Senior Software Engineer for Digital Collections Discovery at the Bodleian Libraries (2017–2020). Andrew has held positions on the technical group and board of the Music Encoding Initiative and with the Executive of the IIIF Consortium. Andrew specializes in web technologies for building scalable and usable search and retrieval systems, and currently leads development on the Muscat+ application."
              de: "Andrew Hankinson is a digital humanist, librarian, academic, and coder. He completed a dissertation on large-scale optical music recognition. His research focuses primarily on large-scale music document digitization, recognition, search, and retrieval. He was senior software engineer at the Bodleian Libraries in the University of Oxford, where he led the developments of the Digital Bodleian. He previously developed the DIAMM web application. He was Chair of the MEI Board, and has longstanding experience with IIIF and is a member of the IIIF A/V working group. He currently leads the development of Muscat+."
              fr: "Andrew Hankinson est titulaire d'un Bachelor en histoire et théorie de la musique (Université Acadia), d'une maîtrise en bibliothéconomie et sciences de l'information (Université McGill) et d'un doctorat en Music Information Retrieval (Université McGill). Il a été chercheur postdoctoral à l'Université d'Oxford, travaillant sur le projet Digital Image Archive of Medieval Music (DIAMM) (2015-2016), et a été ingénieur logiciel principal pour le développement de la Digital Collections Discovery de la bibliothèque Bodleian (2017-2020). Andrew a occupé des postes au sein du groupe technique et du comité directeur de la Music Encoding Initiative, ainsi qu'au sein de l'exécutif du consortium IIIF. Andrew est spécialisé dans les technologies web pour le développement de systèmes de recherche évolutifs et conviviaux, et dirige actuellement le développement de l'application Muscat+."
              it: "Andrew Hankinson is a digital humanist, librarian, academic, and coder. He completed a dissertation on large-scale optical music recognition. His research focuses primarily on large-scale music document digitization, recognition, search, and retrieval. He was senior software engineer at the Bodleian Libraries in the University of Oxford, where he led the developments of the Digital Bodleian. He previously developed the DIAMM web application. He was Chair of the MEI Board, and has longstanding experience with IIIF and is a member of the IIIF A/V working group. He currently leads the development of Muscat+."
        - id: RZ
          name: "Rodolfo Zitellini, M. A."
          email: "rodolfo.zitellini@rism.digital"
          photo: "rodolfo.zitellini.jpg"
          text:
              en: "Rodolfo Zitellini is a musician and musicologist with a specialization in computer sciences. He obtained a Diploma in Harpsichord in Bologna (Italy) and subsequently a Master’s degree in Musicology in Fribourg. He worked as consultant for embedded software systems (2005-2011) and as a freelance musicologist. He initially participated in the SNF project <q>Printed Sacred Music in Europe 1500-1800</q> (2011-2013) as technical consultant, and since 2011 he collaborates with RISM Switzerland on the digital infrastructure and development of the cataloguing application Muscat. He is also in charge of special non-technical projects."
              de: "Rodolfo Zitellini ist Musiker und Musikwissenschaftler mit Schwerpunkt auf Informatik. Er erhielt ein Diplom als Cembalist in Bologna (Italien) und anschliessend einen Master-Abschluss in Musikwissenschaft in Freiburg i.Ue. Er arbeitete sowohl als Berater für eingebettete Software-Systeme (2005-2011) als auch als unabhängiger Musikwissenschaftler. Rodolfo Zitellini nahm am SNF-Projekt <q>Printed Sacred Music in Europe 1500-1800</q> als technischer Berater teil (2011-2013). Seit 2011 arbeitet er bei RISM Schweiz im Bereich der digitalen Infrastruktur und beschäftigt sich vornehmlich mit der Entwicklung der Katalogisierungs-Anwendung Muscat. Er ist auch zuständig für nicht-technische Sonderprojekte."
              fr: "Rodolfo Zitellini est un musicien et musicologue avec une spécialisation en informatique. Il a obtenu un diplôme en clavecin à Bologne (Italie), puis une maîtrise en musicologie à l'Université de Fribourg. Il a travaillé comme consultant pour des systèmes de logiciels embarqués (2005-2011) et comme musicologue indépendant. Il a participé au projet FNS <q>Printed Sacred Music in Europe 1500-1800</q> (2011-2013) en tant que consultant technique. Depuis 2011, il travaille au RISM Suisse dans la gestion de l'infrastructure informatique et au développement de l'application de catalogage Muscat. Il est aussi en charge de projets spéciaux non techniques."
              it: "Rodolfo Zitellini è musicista e musicologo con una specializzazione in scienze informatiche. Ha conseguito il Diploma di Clavicembalo a Bologna e successivamente un Master in Musicologia a Friburgo (Svizzera). Ha lavorato come consulente per sistemi embedded di software (2005-2011) e come musicologo indipendente. Ha partecipato al progetto FNS <q>Printed Sacred Music in Europe 1500-1800</q> (2011-2013) come consulente tecnico. Dal 2011 lavora presso RISM Svizzera all'infrastruttura digitale e allo sviluppo del software di catalogazione Muscat. Inoltre è responsabile di progetti speciali non tecnici."
        - id: LB
          name: "Lynn Beutler, M. A."
          email: "lynn.beutler@rism.digital"
          no-photo: true
          text:
              en: "Lynn Beutler studied Musicology and English at the University of Bern. During her studies she already gained some work experience at the RISM Digital Center first as a student assistant and later as an intern. After completing her master’s degree in autumn 2021, she has become a permanent employee. Her main tasks are cataloging historical musical sources at different locations. What she appreciates most about her work is its versatility and the opportunity to contribute to accessing historical music sources."
              de: "Lynn Beutler studierte Musikwissenschaft im Hauptfach und Englisch im Nebenfach an der Universität in Bern. Bereits während ihres Studiums lernte sie als studentische Hilfskraft und später als Praktikantin die Arbeit beim RISM Digital Center kennen. Seit Herbst 2021, nach Abschluss ihres Masterstudiums, gehört sie als feste Mitarbeiterin zu RISM. Zu ihren Hauptaufgaben gehört das Katalogisieren und Inventarisieren von Musikquellen an diversen Standorten. An ihrer Arbeit schätzt sie besonders die Vielseitigkeit und die Möglichkeit, einen Beitrag zum Zugang zu historischen Musikquellen zu ermöglichen."
              fr: "Lynn Beutler a étudié la musicologie en branche principale et l’anglais en branche secondaire à l’Université de Berne. Pendant ses études déjà, elle a fait des expériences de travail au RISM Digital Center en tant qu’assistante étudiante puis en tant que stagiaire. Depuis l’automne 2021, à la fin de ses études de master, elle fait partie du RISM en tant que collaboratrice fixe. Ses tâches principales consistent à cataloguer et à inventorier des sources musicales sur différents sites. Elle apprécie particulièrement la diversité de son travail et la possibilité de contribuer à l'accès aux sources musicales historiques."
              it: "Lynn Beutler ha studiato musicologia e inglese all’Università di Berna. Già durante i suoi studi, ha avuto modo di fare esperienze lavorative presso il RISM Digital Center, prima come assistente studentesca e poi come stagista. Dopo aver completato il suo Master nell’autunno 2021, ha assunto un impiego stabile al RISM. I suoi compiti principali includono la catalogazione e l’inventario delle fonti musicali in vari luoghi. Ciò che apprezza particolarmente del suo lavoro è la versatilità e l’opportunità di contribuire all’accesso alle fonti musicali storiche."
